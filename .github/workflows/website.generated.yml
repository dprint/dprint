# GENERATED BY ./website.ts -- DO NOT DIRECTLY EDIT

name: Website
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Cloudflare
        type: boolean
        default: false
  release:
    types:
      - published
  push:
    branches:
      - main
    paths:
      - website/**
      - docs/**
      - "**.md"
      - crates/dprint/src/commands/lsp/config_schema.json
      - dprint.json
      - .github/workflows/website.*
  pull_request:
    branches:
      - main
    paths:
      - website/**
      - docs/**
      - "**.md"
      - crates/dprint/src/commands/lsp/config_schema.json
      - dprint.json
      - .github/workflows/website.*
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2
        with:
          cache: true
          args: '--excludes ''**/*.rs'''
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          cache: true
          deno-version: canary
      - name: Install dependencies
        run: (cd website && deno install)
      - name: Build playground
        run: (cd website/playground && deno task build)
      - name: Test playground
        run: (cd website/playground && deno task test)
      - name: Test worker
        run: (cd website && deno task test)
      - name: Build website
        run: "(cd website && deno task build:ci)"
      - name: Upload artifact website
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        with:
          name: website
          path: website/_site
          retention-days: 1
  deploy:
    needs:
      - build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: (cd website && deno install)
      - name: Download artifact website
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: website
          path: website/_site
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        run: (cd website && deno task deploy)
