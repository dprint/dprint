# GENERATED BY ./website.ts -- DO NOT DIRECTLY EDIT

name: Website
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          cache: true
          deno-version: canary
      - name: Install dependencies
        run: (cd website && deno install)
      - name: Build playground
        run: (cd website/playground && deno task build)
      - name: Test playground
        run: (cd website/playground && deno task test)
      - name: Build website
        run: "(cd website && deno task build:ci)"
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@132898c54c57c7cc6b80eb3a89968de8fc283505 # releases/v3
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        with:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          BRANCH: gh-pages
          FOLDER: website/_site
          single-commit: true
